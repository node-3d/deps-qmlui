name: Build native binaries
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Binary release tag to update.'
        required: false
        default: '5.0.2'
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Pack npm Candidate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Store npm Candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16

  build:
    name: Build (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix: &native-matrix
        include:
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
            archive: linux
            qmake_spec: linux-g++-64
          - target: linux-arm64
            # Qt's official Linux ARM64 binaries require GLIBC_2.38.
            os: ubuntu-24.04-arm
            node_arch: arm64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64
            archive: aarch64
            qmake_spec: linux-g++
          - target: darwin-x64
            os: macos-15-intel
            node_arch: x64
            qt_host: mac
            qt_arch: clang_64
            qt_dir: macos
            archive: osx
            apple_archs: x86_64
          - target: darwin-arm64
            os: macos-15
            node_arch: arm64
            qt_host: mac
            qt_arch: ''
            qt_dir: macos
            archive: darwin-arm64
            apple_archs: arm64
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
            archive: windows
            msvc_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Qt
        if: matrix.qt_arch != ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: 'true'
          cache-key-prefix: install-qt-${{ matrix.target }}
      - name: Install Qt (default architecture)
        if: matrix.qt_arch == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          cache: 'true'
          cache-key-prefix: install-qt-${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: npm
      - name: Install Modules
        run: npm ci --ignore-scripts
      - name: Install MSVC
        if: startsWith(matrix.target, 'windows-')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Build - Windows
        if: startsWith(matrix.target, 'windows-')
        run: |
          qmake -spec win32-msvc src/qt/_qmlui.pro
          mv /usr/bin/link.exe /usr/bin/1link.exe
          nmake
          mv /usr/bin/1link.exe /usr/bin/link.exe
          mkdir -p bin-${{ matrix.archive }}
          cp src/qmlui.dll src/qmlui.lib bin-${{ matrix.archive }}
      - name: Build - Linux
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq patchelf
          qmake -spec ${{ matrix.qmake_spec }} src/qt/_qmlui.pro
          make
          patchelf --force-rpath --set-rpath '$ORIGIN:$ORIGIN/../node_modules/@node-3d/deps-qt-core/bin-${{ matrix.archive }}:$ORIGIN/../node_modules/@node-3d/deps-qt-gui/bin-${{ matrix.archive }}:$ORIGIN/../node_modules/@node-3d/deps-qt-qml/bin-${{ matrix.archive }}:$ORIGIN/../../deps-qt-core/bin-${{ matrix.archive }}:$ORIGIN/../../deps-qt-gui/bin-${{ matrix.archive }}:$ORIGIN/../../deps-qt-qml/bin-${{ matrix.archive }}' src/libqmlui.so
          mkdir -p bin-${{ matrix.archive }}
          cp src/libqmlui.so bin-${{ matrix.archive }}
      - name: Build - macOS
        if: startsWith(matrix.target, 'darwin-')
        run: |
          qmake -spec macx-clang "QMAKE_APPLE_DEVICE_ARCHS=${{ matrix.apple_archs }}" "QMAKE_CXXFLAGS+=-ObjC++" "QMAKE_LFLAGS_SONAME=-Wl,-install_name,@rpath/" "INCLUDEPATH+=${{ github.workspace }}/../Qt/6.8.0/${{ matrix.qt_dir }}/include" src/qt/_qmlui.pro
          make
          mkdir -p bin-${{ matrix.archive }}
          cp src/libqmlui.dylib bin-${{ matrix.archive }}
      - name: Verify macOS deployment target
        if: startsWith(matrix.target, 'darwin-')
        run: |
          set -euo pipefail
          versions="$(otool -l bin-${{ matrix.archive }}/libqmlui.dylib | awk '
            $1 == "cmd" {
              wanted = $2 == "LC_BUILD_VERSION" ? "minos" : ($2 == "LC_VERSION_MIN_MACOSX" ? "version" : "")
            }
            wanted != "" && $1 == wanted { print $2; wanted = "" }
          ')"
          if [ -z "$versions" ] || printf '%s\n' "$versions" | grep -Evxq '13\.5(\.0)?'; then
            echo "Unexpected or missing macOS deployment target: $versions" >&2
            exit 1
          fi
      - name: Store Native Candidate
        uses: node-3d/addon-tools/actions/native-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          artifact-name: native-${{ matrix.target }}

  consumer-tests:
    name: Packed Consumer (${{ matrix.target }})
    needs: [package, build]
    strategy:
      fail-fast: false
      matrix: *native-matrix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
      - name: Install Qt runtime dependencies - Linux
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq libegl1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install Packed Consumer Candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          package-name: '@node-3d/deps-qmlui'
          binary-artifact: native-${{ matrix.target }}
          fixture: test-consumer
      - name: Build Packed Consumer Addon
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm run build
      - name: Run Packed Consumer Tests
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            core_bin="$(node -p "require('@node-3d/deps-qmlui').core.bin")"
            gui_bin="$(node -p "require('@node-3d/deps-qmlui').gui.bin")"
            qml_bin="$(node -p "require('@node-3d/deps-qmlui').qml.bin")"
            qmlui_bin="$(node -p "require('@node-3d/deps-qmlui').bin")"
            export LD_LIBRARY_PATH="$core_bin:$gui_bin:$qml_bin:$qmlui_bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          npm test

  release:
    name: Update Binary Release
    needs: consumer-tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download Native Candidates
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-candidates
          merge-multiple: true
      - name: Attest Binaries
        uses: actions/attest@v4
        with:
          subject-path: release-candidates/*.gz
      - name: Update Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Release ${{ inputs.release_tag }}
          files: release-candidates/*.gz
