name: Build
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag/version to build. Defaults to package.json version.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: 'npm'

      - name: Get Package Version
        id: package-version
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(node -p "require('./package').version")"
          fi
          echo "version=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: Release ${{ steps.package-version.outputs.version }}

  build:
    name: Build (${{ matrix.target }})
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
            archive: linux
            qmake_spec: linux-g++-64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            node_arch: arm64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64
            archive: aarch64
            qmake_spec: linux-g++
          - target: darwin-x64
            os: macos-15-intel
            node_arch: x64
            qt_host: mac
            qt_arch: clang_64
            qt_dir: macos
            archive: osx
            apple_archs: x86_64
          - target: darwin-arm64
            os: macos-15
            node_arch: arm64
            qt_host: mac
            qt_arch: ''
            qt_dir: macos
            archive: darwin-arm64
            apple_archs: arm64
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
            archive: windows
            msvc_arch: x64

    runs-on: ${{ matrix.os }}

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Qt
        if: matrix.qt_arch != ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: 'true'
          cache-key-prefix: install-qt-${{ matrix.target }}

      - name: Install Qt
        if: matrix.qt_arch == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          cache: 'true'
          cache-key-prefix: install-qt-${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"
          npm config get arch

      - name: Install Modules
        run: npm ci --ignore-scripts

      - name: Install MSVC
        if: startsWith(matrix.target, 'windows-')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build - Windows
        if: startsWith(matrix.target, 'windows-')
        run: |
          echo "OS_NAME=${{ matrix.archive }}" >> $GITHUB_ENV
          qmake -spec win32-msvc src/qt/_qmlui.pro
          mv /usr/bin/link.exe /usr/bin/1link.exe
          nmake
          mv /usr/bin/1link.exe /usr/bin/link.exe
          rm -rf bin-${{ matrix.archive }}
          mkdir bin-${{ matrix.archive }}
          cp src/qmlui.dll bin-${{ matrix.archive }}
          cp src/qmlui.lib bin-${{ matrix.archive }}

      - name: Build - Linux
        if: startsWith(matrix.target, 'linux-')
        run: |
          echo "OS_NAME=${{ matrix.archive }}" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -qq patchelf
          qmake -spec ${{ matrix.qmake_spec }} src/qt/_qmlui.pro
          make
          patchelf --force-rpath --set-rpath '$ORIGIN:$ORIGIN/../node_modules/@node-3d/deps-qt-core/bin-${{ matrix.archive }}:$ORIGIN/../node_modules/@node-3d/deps-qt-gui/bin-${{ matrix.archive }}:$ORIGIN/../node_modules/@node-3d/deps-qt-qml/bin-${{ matrix.archive }}:$ORIGIN/../../deps-qt-core/bin-${{ matrix.archive }}:$ORIGIN/../../deps-qt-gui/bin-${{ matrix.archive }}:$ORIGIN/../../deps-qt-qml/bin-${{ matrix.archive }}' src/libqmlui.so
          rm -rf bin-${{ matrix.archive }}
          mkdir bin-${{ matrix.archive }}
          cp src/libqmlui.so bin-${{ matrix.archive }}

      - name: Build - MacOS
        if: startsWith(matrix.target, 'darwin-')
        run: |
          echo "OS_NAME=${{ matrix.archive }}" >> $GITHUB_ENV
          qmake -spec macx-clang "QMAKE_APPLE_DEVICE_ARCHS=${{ matrix.apple_archs }}" "QMAKE_CXXFLAGS+=-ObjC++" "QMAKE_LFLAGS_SONAME=-Wl,-install_name,@rpath/" "INCLUDEPATH+=${{ github.workspace }}/../Qt/6.8.0/${{ matrix.qt_dir }}/include" src/qt/_qmlui.pro
          make
          rm -rf bin-${{ matrix.archive }}
          mkdir bin-${{ matrix.archive }}
          cp src/libqmlui.dylib bin-${{ matrix.archive }}

      - name: Get Package Version
        id: package-version
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(node -p "require('./package').version")"
          fi
          echo "version=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Pack Files
        id: pack-files
        run: |
          cd 'bin-${{ env.OS_NAME }}'
          tar -czf ../${{ env.OS_NAME }}.gz *
          echo "pack=${{ env.OS_NAME }}.gz" >> $GITHUB_OUTPUT

      - name: Attest Binary
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.pack-files.outputs.pack }}

      - name: Store Binaries
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: Release ${{ steps.package-version.outputs.version }}
          files: ${{ steps.pack-files.outputs.pack }}
